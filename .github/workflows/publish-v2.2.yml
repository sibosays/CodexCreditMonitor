name: Publish v2.2 release
on:
  push:
    tags: ["v2.2"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.2 downloads/CodexCreditMonitorPortable_2.2.zip downloads/SHA256SUMS.txt assets/dashboard-v2.2.png --title "Codex Credit Monitor v2.2" --notes "## Codex Credit Monitor v2.2" --latest